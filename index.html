<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Ccircle cx=%229%22 cy=%2216%22 r=%226%22 fill=%22%239c620c%22/%3E%3Ccircle cx=%2223%22 cy=%2216%22 r=%226%22 fill=%22%232F4A8A%22/%3E%3C/svg%3E">
<title>Protected page</title>
<style>
:root { --ground: #f4f6f5; --panel: #ffffff; --ink: #17201d; --muted: #56625e; --rule: #cfd6d3; --accent: #2F4A8A; --bad: #B0285C; }
@media (prefers-color-scheme: dark) { :root { --ground: #101614; --panel: #171f1c; --ink: #e3e9e6; --muted: #9aa8a3; --rule: #2e3b37; --accent: #8FA8E8; --bad: #E26A96; color-scheme: dark; } }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--ground); color: var(--ink); font: 16px/1.5 "Segoe UI", system-ui, sans-serif; padding: 20px; box-sizing: border-box; }
form { background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; padding: 28px; width: min(380px, 100%); display: grid; gap: 14px; }
h1 { font-size: 1.3rem; margin: 0; }
p { margin: 0; color: var(--muted); font-size: 0.92rem; }
input { font: inherit; padding: 9px 11px; border: 1px solid var(--rule); border-radius: 4px; background: var(--ground); color: var(--ink); }
button { font: inherit; font-weight: 600; padding: 9px 12px; border: 0; border-radius: 4px; background: var(--accent); color: var(--panel); cursor: pointer; }
button:disabled { opacity: 0.6; cursor: wait; }
input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#msg { min-height: 1.4em; }
#msg.bad { color: var(--bad); }
progress { width: 100%; }
</style>
</head>
<body>
<form id="f" autocomplete="off">
  <h1>This page is protected</h1>
  <p>Enter the password you were given. Everything is decrypted in your browser.</p>
    <input id="pw" type="password" required autofocus aria-label="Password">
  <button id="go" type="submit">Open</button>
  <progress id="bar" max="1" value="0" hidden></progress>
  <p id="msg" role="status"></p>
</form>
<script>
const $ = (id) => document.getElementById(id);
const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
async function deriveKey(pw, m) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(m.salt), iterations: m.iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
}
async function dec(key, iv, data, aad) {
  return new Uint8Array(await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(iv), additionalData: new TextEncoder().encode(aad) }, key, data));
}
async function open(pw) {
  const m = await (await fetch("manifest.json", { cache: "no-store" })).json();
  const key = await deriveKey(pw, m);
  try { await dec(key, m.checkIv, b64(m.check), "check"); } catch { throw new Error("wrong"); }
  m.files = JSON.parse(new TextDecoder().decode(await dec(key, m.mapIv, b64(m.map), "map")));
  const names = Object.keys(m.files), urls = {}, text = {};
  const bar = $("bar"); bar.hidden = false; bar.max = names.length;
  let done = 0;
  // binary assets first, as blob URLs
  await Promise.all(names.filter((n) => !n.endsWith(".html")).map(async (n) => {
    const f = m.files[n], raw = new Uint8Array(await (await fetch("d/" + f.id)).arrayBuffer());
    urls[n] = URL.createObjectURL(new Blob([await dec(key, f.iv, raw, n)], { type: f.type }));
    bar.value = ++done;
  }));
  for (const n of names.filter((x) => x.endsWith(".html"))) {
    const f = m.files[n], raw = new Uint8Array(await (await fetch("d/" + f.id)).arrayBuffer());
    text[n] = new TextDecoder().decode(await dec(key, f.iv, raw, n)); bar.value = ++done;
  }
  const swap = (html) => Object.keys(urls).sort((a, b) => b.length - a.length).reduce((h, n) => h.split(n).join(urls[n]), html);
  // One page, many views: decrypted pages are written into this document in place, so the blob URLs created here
  // stay valid. Routes live in the hash: #papers, #analysis-17, #network, #overview, #home; any other hash is an
  // anchor inside the current view.
  const fix = (h) => h
    .split('src="network.html').join(`src="${urls["network.html"] || ""}`)
    .split('href="papers.html"').join('href="#papers"')
    .split('href="network.html"').join('href="#network"')
    .split('href="overview-sheet.html"').join('href="#overview"')
    .split('href="propositions.html#open"').join('href="#propositions"')
    .split('href="propositions.html"').join('href="#propositions"')
    .split('href="analysis.html#').join('href="#analysis-')
    .split('href="./"').join('href="#home"');
  if (text["network.html"]) urls["network.html"] = URL.createObjectURL(new Blob([swap(text["network.html"])], { type: "text/html" }));
  const VIEWS = { home: "index.html", papers: "papers.html", network: "network.html", overview: "overview-sheet.html", analysis: "analysis.html", propositions: "propositions.html" };
  // review pages are reached only by their route (#review-41); they are not linked from the site's nav
  for (const n of Object.keys(text)) { const r = n.match(/^review-([\w-]+)\.html$/); if (r) VIEWS["review-" + r[1]] = n; }
  const pages = {};
  for (const [k, f] of Object.entries(VIEWS)) if (text[f]) pages[k] = fix(swap(text[f])).replace("</body>", "<script>window.__site && window.__site.wire()<\/script></body>");
  let main = pages.home;
  main = main.replace(/<a href="(blob:[^"]+)"><b>/g, (s, u) => {
    const n = Object.keys(urls).find((k) => urls[k] === u); return n && !n.endsWith(".html") ? `<a href="${u}" download="${n.split("/").pop()}"><b>` : s;
  });
  pages.home = main;
  // a route name switches views; any other hash is an anchor inside the current view
  // each history entry remembers its view, so Back to an anchor returns to the view that held it
  const viewOf = (h) => (["papers", "network", "overview", "propositions", "home"].includes(h) || (h.startsWith("review-") && VIEWS[h]) ? h : h.startsWith("analysis-") ? "analysis" : (history.state && history.state.view) || (window.__site && window.__site.current) || "home");
  const site = (window.__site = { current: null, pages,
    route() {
      const h = decodeURIComponent(location.hash.slice(1)), v = viewOf(h);
      try { if (!history.state || history.state.view !== v) history.replaceState({ view: v }, ""); } catch {}
      if (v === site.current) return;
      site.current = v; document.open(); document.write(site.pages[v]); document.close();
      if (h && !VIEWS[h] && !h.startsWith("analysis-")) setTimeout(() => document.getElementById(h)?.scrollIntoView(), 50); else window.scrollTo(0, 0);
    },
    wire() { window.removeEventListener("hashchange", site.route); window.addEventListener("hashchange", site.route); } });
  try { sessionStorage.setItem("pw", pw); } catch {}
  site.route();
}
$("f").addEventListener("submit", async (e) => {
  e.preventDefault(); $("go").disabled = true; $("msg").className = ""; $("msg").textContent = "Decrypting...";
  try { await open($("pw").value); }
  catch (err) { $("go").disabled = false; $("bar").hidden = true; $("msg").className = "bad"; $("msg").textContent = err.message === "wrong" ? "That password is not correct." : "Something went wrong while opening the page. Reload and try again."; }
});
(async () => { let pw = null; try { pw = sessionStorage.getItem("pw"); } catch {} if (pw) { $("msg").textContent = "Decrypting..."; try { await open(pw); } catch { $("msg").textContent = ""; } } })();
</script>
</body>
</html>
